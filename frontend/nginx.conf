server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # API and uploaded images are served by the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # React Router: unknown paths load index.html
    location / {
        try_files $uri /index.html;
    }
}
