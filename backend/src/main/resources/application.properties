spring.application.name=parlour-api
server.port=8080

# ---- Database (MySQL running in Docker, see docker-compose.yml) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parlour?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpass}

# ---- JPA / Hibernate (ORM): tables are created/updated from the entity classes ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- File uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# ---- JWT (access token + refresh token) ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# ---- Brute-force protection on the password step ----
app.security.login-max-failures=5
app.security.login-lock-minutes=15

# ---- OTP ----
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=30
# DEV ONLY: when true the OTP is also returned in the API response so you can demo without an SMS gateway.
# Set to false in production (the code then only goes out by SMS).
app.otp.dev-echo=true

# ---- Booking rules ----
app.booking.open-time=10:00
app.booking.close-time=20:00
app.booking.slot-minutes=30
# how many customers can be served at the same time (number of chairs/staff)
app.booking.capacity=2

# ---- Seeded admin accounts (created on first start only) ----
app.seed.owner-email=owner@parlour.local
app.seed.owner-password=Owner@12345
app.seed.owner-phone=+8801700000001
app.seed.manager-email=manager@parlour.local
app.seed.manager-password=Manager@12345
app.seed.manager-phone=+8801700000002
